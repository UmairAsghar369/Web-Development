<!DOCTYPE html>
<html>
<head>
    <title>My HTML5 Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header section -->
    <header>
        <h1>Welcome to My Web Page</h1>
    </header>

    <!-- Navigation section -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
    </nav>

    <!-- Main content -->
    <main>

        <!-- Section for About (with semantic meaning) -->
        <section>
            <h2>About</h2>
            <p>This is a simple HTML5 web page.</p>
        </section>

        <!-- Div for Multimedia content -->
        <div>
            <h2>Media</h2>
            <audio controls>
                <source src="audio.mp3" type="audio/mpeg">
            </audio>
            <br><br>
            <video width="200" controls>
                <source src="video.mp4" type="video/mp4">
            </video>
        </div>

        <!-- Section for Contact Form (with semantic meaning) -->
        <section>
            <h2>Contact Form</h2>
            <form>
                <label for="name">Name:</label>
                <input type="text" id="name"><br><br>

                <label for="email">Email:</label>
                <input type="email" id="email"><br><br>

                <input type="submit" value="Send">
            </form><br> 
        </section>

        <!-- Button for user interaction -->
        <div>
            <button onclick="alert('Button clicked!')">Click Me</button>
        </div>
    </main>

    <!-- Footer section -->
    <footer>
        <p>End of page</p>
    </footer>

</body>
</html>
