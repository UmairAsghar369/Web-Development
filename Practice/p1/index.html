<!DOCTYPE html>
<html>
<head>
    <title>My HTML5 Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header section -->
    <header>
        <h1>Welcome to My Web Page</h1>
    </header>

    <!-- Navigation section -->
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
    </nav>

    <!-- Main content -->
    <main>
        <!-- Section for text -->
        <section>
            <h2>About</h2>
            <p>This is a simple HTML5 web page.</p>
        </section>

        <!-- Multimedia content -->
        <section>
            <h2>Media</h2>
            <audio controls>
                <source src="audio.mp3" type="audio/mpeg">
            </audio>
            <br><br>
            <video width="200" controls>
                <source src="video.mp4" type="video/mp4">
            </video>
        </section>

        <!-- Form section -->
        <section>
            <h2>Contact Form</h2>
            <form>
                Name: <input type="text"><br><br>
                Email: <input type="email"><br><br>
                <input type="submit" value="Send">
            </form>
        </section>
    </main>

    <!-- Footer section -->
    <footer>
        <p>End of page</p>
    </footer>

</body>
</html>
