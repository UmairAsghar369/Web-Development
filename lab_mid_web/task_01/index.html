<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Listing Flexbox</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5f5f5;
}

.products{
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 15px;
}

.product{
    width: 180px;
    padding: 20px;
    border: 2px solid #333;
    background: white;
    text-align: center;
    border-radius: 8px;
    transition: 0.3s;
}

.product:hover{
    background: #e6f7ff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    transform: translateY(-5px);
}

@media (max-width:600px){
    .products{
        flex-direction: column;
        align-items: center;
    }
}
</style>
</head>

<body>

<h2>Product Listing Layout</h2>

<div class="products">
    <div class="product">Product 1</div>
    <div class="product">Product 2</div>
    <div class="product">Product 3</div>
</div>

</body>
</html>
