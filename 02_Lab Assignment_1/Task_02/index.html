<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Portal | Log in</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== Login Box ===== -->
    <div class="login-box">

        <h2>Alumni Portal</h2>
        <p class="subtitle">Sign in to start your session</p>

        <!-- Username Field -->
        <div class="input-group">
            <input type="text" placeholder="Enter alumni portal login">
            <span class="icon">&#128100;</span>
        </div>

        <!-- Password Field -->
        <div class="input-group">
            <input type="password" placeholder="Password">
            <span class="icon">&#128274;</span>
        </div>

        <!-- Remember Me + Sign In -->
        <div class="options-row">
            <label class="remember-me">
                <input type="checkbox"> Remember Me
            </label>
            <button class="btn-signin">Sign In</button>
        </div>

        <!-- Forgot Password -->
        <a href="#" class="forgot-link">I forgot my password</a>

        <!-- Synopsis Portal & Student HelpDesk Buttons -->
        <div class="portal-buttons">
            <button class="btn-synopsis">Synopsis Portal</button>
            <button class="btn-helpdesk">Student HelpDesk</button>
        </div>

        <!-- Register Section -->
        <div class="register-section">
            <p>Don't have an account yet?</p>
            <button class="btn-register">Register here</button>
        </div>

        <!-- Footer -->
        <p class="footer">Copyright 2024 ITCentre, CUI Islamabad. All Rights Reserved.</p>

    </div>

</body>
</html>
